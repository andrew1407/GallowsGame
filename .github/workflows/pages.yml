# Publishes the WebGL build to GitHub Pages, so the game can be played in the browser.
#
# It deploys the WebGL archive "Build & test project" already made instead of building again:
# no second 25-minute build, and no extra Unity license activation (a Personal license only allows two at a time).
#
# NOTE: Pages must be served from GitHub Actions —
# Settings → Pages → Build and deployment → Source: "GitHub Actions"
name: GitHub Pages

on:
  workflow_run:
    workflows: ["Build & test project"]
    types: [completed]
    branches: [main]
  workflow_dispatch:   # redeploy the latest successful main build on demand

permissions:
  contents: read
  actions: read   # download the build from the other workflow's run
  pages: write
  id-token: write

# One deployment at a time; a newer build supersedes an in-flight one
concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Assemble site
    # Only builds of pushes to main that passed (tests included), not pull requests
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      # Pages cannot set Content-Encoding, so the build relies on the player's decompression
      # fallback (PlayerSettings → WebGL → Publishing → Decompression Fallback) to load
      - name: Download WebGL build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --workflow main.yml --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          echo "Deploying the WebGL build of run $RUN_ID"
          gh run download "$RUN_ID" --name GallowsGame-WebGL --dir artifact
          unzip -q artifact/GallowsGame-WebGL.zip -d _site
          # Serve Unity's files as they are, without Jekyll processing
          touch _site/.nojekyll
          du -sh _site && ls _site

      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
